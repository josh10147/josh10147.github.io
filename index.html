<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Logo -->
    <img class="logo" src="event-menu/images/logo.png" alt="Logo">

    <!-- Buttons -->
    <div class="grid">

        <button class="sections-btn" onclick="openMenu('sections')">
            Sections
        </button>

        <button onclick="openMenu('bottle')">
            Bottle Menu
        </button>

        <button onclick="openMenu('drink')">
            Drink Menu
        </button>

        <button onclick="openMenu('food')">
            Food Menu
        </button>

        <button onclick="openMenu('hookah')">
            Hookah Menu
        </button>

    </div>

    <!-- Image Viewer -->
    <div id="viewer">
        <img id="menuImage" src="" alt="">
    </div>

    <script>

        let sections = [
            "event-menu/images/section_1.jpg",
            "event-menu/images/section_2.png",
            "event-menu/images/section_3.png",
            "event-menu/images/section_4.png"
        ];

        let slide = 0;
        let timer;

        function openMenu(type) {

            clearInterval(timer);

            const img = document.getElementById("menuImage");

            if (type === "sections") {

                slide = 0;
                img.src = sections[slide];

                timer = setInterval(() => {

                    slide++;

                    if (slide >= sections.length)
                        slide = 0;

                    img.src = sections[slide];

                }, 3000);

                return;
            }

            if (type === "bottle") {
                img.src="event-menu/images/bottle_menu.png";
            }

            if (type === "drink") {
                img.src="event-menu/images/drink_menu.PNG";
            }

            if (type === "food") {
                img.src="event-menu/images/food_menu.png";
            }

            if (type === "hookah") {
                img.src = "event-menu/images/hookah-menu.png";
            }

        }

    </script>

</body>

</html>
